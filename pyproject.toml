[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectra"
version = "0.1.0"
description = "AI-powered code review engine for pull requests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akash Soni", email="akash.soni.3101@gmail.com" }]
maintainers = [{ name = "Akash Soni", email="akash.soni.3101@gmail.com" }]
keywords = ["code-review", "ai", "llm", "github", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "GitPython>=3.1.41",
    "unidiff>=0.7.5",
    "PyGithub>=2.2.0",
    "PyYAML>=6.0.1",
    "tiktoken>=0.6.0",
    "openai>=1.14.0",
    "anthropic>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
inspectra = "inspectra.cli:app"


[project.urls]
Homepage = "https://github.com/iamakashsoni/inspectra"
Repository = "https://github.com/iamakashsoni/inspectra"
Documentation = "https://github.com/iamakashsoni/inspectra#readme"
"Bug Tracker" = "https://github.com/iamakashsoni/inspectra/issues"
Changelog = "https://github.com/iamakashsoni/inspectra/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=inspectra --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
