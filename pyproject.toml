[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectra"
version = "0.2.0"
description = "AI-powered self-hosted code reviewer for pull requests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akash Soni", email = "akash.soni.3101@gmail.com" }]
keywords = ["code-review", "ai", "llm", "github", "devtools", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "GitPython>=3.1.41",
    "unidiff>=0.7.5",
    "PyGithub>=2.2.0",
    "PyYAML>=6.0.1",
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
# Cloud providers are optional — self-hosted Ollama users don't need them
openai = ["openai>=1.14.0"]
anthropic = ["anthropic>=0.20.0"]
all = ["openai>=1.14.0", "anthropic>=0.20.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
inspectra = "inspectra.cli:app"

[project.urls]
Homepage = "https://github.com/iamakashsoni/inspectra"
Repository = "https://github.com/iamakashsoni/inspectra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
