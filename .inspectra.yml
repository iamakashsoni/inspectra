# .inspectra.yml — Inspectra v2 configuration (self-hosted default)
# Docs: https://github.com/iamakashsoni/inspectra

# LLM provider: ollama | openai | anthropic | nvidia | openrouter
provider: ollama
model: qwen2.5-coder:14b

# Ollama (only used when provider = ollama)
ollama:
  host: http://localhost:11434
  timeout: 300

# Review categories (set to false to disable)
review:
  security: true
  bugs: true
  performance: true
  maintainability: true
  architecture: true
  concurrency: true
  scalability: true

# Files/patterns to exclude from review
exclude:
  - "*.lock"
  - "package-lock.json"
  - "yarn.lock"
  - "dist/*"
  - "build/*"
  - "*.min.js"
  - "*.min.css"
  - "vendor/*"

# Token limits
max_tokens: 12000
max_chunk_tokens: 3000

# LLM temperature (lower = more deterministic)
temperature: 0.2

# Concurrency: 0 = auto-pick per provider
# (Ollama=3, OpenAI=10, Anthropic=8, Nvidia=5, OpenRouter=5)
review_concurrency: 0

# Post inline comments at issue lines when reviewing a PR
inline_comments: true
